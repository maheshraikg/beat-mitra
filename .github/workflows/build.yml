name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beat-mitra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Check generated translations are up to date
        run: |
          python3 tool/gen_arb.py
          flutter gen-l10n
          git diff --exit-code -- lib/core/l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APKs (offline + map)
        run: |
          flutter build apk --release --flavor offline
          flutter build apk --release --flavor map
          ls -l build/app/outputs/flutter-apk/

      - name: Check the offline APK has no INTERNET permission
        run: |
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          $AAPT2 dump permissions build/app/outputs/flutter-apk/app-offline-release.apk | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "INTERNET found in offline APK"; exit 1; fi
          $AAPT2 dump permissions build/app/outputs/flutter-apk/app-map-release.apk | grep -q "android.permission.INTERNET"

      - uses: actions/upload-artifact@v4
        with:
          name: beat-mitra-apks
          path: |
            build/app/outputs/flutter-apk/app-offline-release.apk
            build/app/outputs/flutter-apk/app-map-release.apk
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/app/outputs/flutter-apk
          cp app-offline-release.apk beat-mitra.apk
          cp app-map-release.apk beat-mitra-map.apk
          gh release create "$GITHUB_REF_NAME" beat-mitra.apk beat-mitra-map.apk \
            --repo "$GITHUB_REPOSITORY" --title "Beat Mitra $GITHUB_REF_NAME" \
            --notes "beat-mitra.apk: offline build (no internet permission) - install this one. beat-mitra-map.apk: adds the optional OpenStreetMap view. Independent helper tool for postmen. Not an official Department of Posts app."
