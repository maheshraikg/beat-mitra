name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beat-mitra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Check generated translations are up to date
        run: |
          python3 tool/gen_arb.py
          flutter gen-l10n
          git diff --exit-code -- lib/core/l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Version
        env:
          HAS_KEY: ${{ secrets.BEATMITRA_SIGNING_PASSWORD != '' }}
        run: |
          echo "HAS_KEY=$HAS_KEY" >> "$GITHUB_ENV"
          BASE=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+\.[0-9]+)\..*/\1/')
          echo "VERSION_NAME=$BASE.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build release APKs (one per processor type)
        env:
          BEATMITRA_SIGNING_PASSWORD: ${{ secrets.BEATMITRA_SIGNING_PASSWORD }}
        run: |
          if [ -z "$BEATMITRA_SIGNING_PASSWORD" ]; then echo "::warning::BEATMITRA_SIGNING_PASSWORD secret not set - APKs use a temporary debug key"; fi
          ARGS="--release --split-per-abi --build-name $VERSION_NAME --build-number $VERSION_CODE"
          flutter build apk $ARGS --flavor offline
          flutter build apk $ARGS --flavor map
          # Play Store bundle (offline flavor). Version code matches the 64-bit APK
          # (Flutter adds 2000 for arm64 split APKs) so either can update the other.
          flutter build appbundle --release --build-name $VERSION_NAME --build-number $((2000 + VERSION_CODE)) --flavor offline
          cd build/app/outputs/flutter-apk
          mkdir -p ../dist
          cp app-arm64-v8a-offline-release.apk ../dist/beat-mitra.apk
          cp app-armeabi-v7a-offline-release.apk ../dist/beat-mitra-32bit.apk
          cp app-arm64-v8a-map-release.apk ../dist/beat-mitra-map.apk
          cp app-armeabi-v7a-map-release.apk ../dist/beat-mitra-map-32bit.apk
          cp ../bundle/offlineRelease/app-offline-release.aab ../dist/beat-mitra-play.aab
          ls -l ../dist

      - name: Check signing and permissions
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          ${BT}apksigner verify --print-certs build/app/outputs/dist/beat-mitra.apk | grep -E "SHA-256|DN"
          ${BT}aapt2 dump permissions build/app/outputs/dist/beat-mitra.apk | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "INTERNET found in offline APK"; exit 1; fi
          ${BT}aapt2 dump permissions build/app/outputs/dist/beat-mitra-map.apk | grep -q "android.permission.INTERNET"

      - uses: actions/upload-artifact@v4
        with:
          name: beat-mitra-apks
          path: build/app/outputs/dist/*
          if-no-files-found: error

      - name: Publish release (main only, needs the signing key)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/app/outputs/dist
          gh release create "v$VERSION_NAME" *.apk *.aab \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Beat Mitra $VERSION_NAME" \
            --notes "**beat-mitra.apk** - install this one (most phones, offline, no internet permission).
          **beat-mitra-32bit.apk** - only for old phones where the first one says *App not installed*.
          **beat-mitra-map.apk / beat-mitra-map-32bit.apk** - same app plus the optional OpenStreetMap view.
          **beat-mitra-play.aab** - bundle for uploading to Google Play (not for phones).

          Updates install over the old version and keep your data.
          Independent helper tool for postmen. Not an official Department of Posts app."
